name: Static package CI and Cloudflare deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build and verify deployable published package
        run: npm run prepare:deploy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Upload the verified static artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darktide-static-package
          path: dist/
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: [static-package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: darktide-cloudflare-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Check out the exact verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked deployment tools
        run: npm ci
      - name: Download the same verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: darktide-static-package
          path: dist/
      - name: Verify the downloaded artifact
        run: npm run verify:static
      - name: Check credential readiness
        id: credential
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is waiting for CLOUDFLARE_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prevent an older commit from replacing newer main
        id: freshness
        if: steps.credential.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped stale deployment; main has moved." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify preview, publish production, and verify HTTPS
        if: steps.credential.outputs.ready == 'true' && steps.freshness.outputs.current == 'true'
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '38d350980998e83d3f405aff0170921a'
          WRANGLER_SEND_METRICS: 'false'
      - name: Save deployment receipt
        if: always() && steps.credential.outputs.ready == 'true' && steps.freshness.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darktide-deployment-receipt
          path: .deployment/last-deployment.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
