name: W01 isolated preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/w01/**'
      - 'source.lock.json'
      - 'scripts/w01-*.mjs'
      - 'test/w01-*.test.mjs'
      - 'docs/w01/history.json'
      - 'docs/w01/retained-history.json'
      - 'docs/w01/retained-preview-manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/w01-preview.yml'
  push:
    branches: [codex/SYP-311-w01]
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild every retained W01 history entry
        required: false
        type: boolean
        default: false
      publish_history:
        description: Publish rebuilt retained history to the fixed GitHub Release
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: w01-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Web candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned prior preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 8a4b3db2b1e835f0757f387ca89a19b9092b35ee
          path: baseline
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the exact pinned R1 preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 872bd72bad255d40af62329b8ffe97a357935275
          path: prior-r1
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the exact published R2 A data source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: a7fabea66f56cd5c8236b6e84a3f6c6586175840
          path: prior-r2
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Classify W01 deployment scope
        id: deployment-scope
        if: github.event_name == 'push'
        working-directory: web
        env:
          W01_DEPLOYMENT_SCOPE_BASE: ${{ github.event.before }}
          W01_DEPLOYMENT_SCOPE_HEAD: ${{ github.sha }}
        run: node scripts/w01-preview-deploy-scope.mjs --base "$W01_DEPLOYMENT_SCOPE_BASE" --head "$W01_DEPLOYMENT_SCOPE_HEAD"
      - name: Classify retained-history policy
        id: history-policy
        working-directory: web
        shell: bash
        env:
          W01_EVENT_NAME: ${{ github.event_name }}
          W01_HISTORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          W01_HISTORY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          W01_FULL_REBUILD: ${{ inputs.full_rebuild || false }}
          W01_PUBLISH_HISTORY: ${{ inputs.publish_history || false }}
        run: |
          set -euo pipefail
          force_rebuild=false
          reason=cache-eligible
          if [ "$W01_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$W01_FULL_REBUILD" = "true" ] || [ "$W01_PUBLISH_HISTORY" = "true" ]; then
              force_rebuild=true
              reason=workflow-dispatch
            else
              reason=workflow-dispatch-cache-eligible
            fi
          elif [ -z "$W01_HISTORY_BASE" ] || [[ "$W01_HISTORY_BASE" =~ ^0+$ ]]; then
            force_rebuild=true
            reason=missing-base
          else
            git fetch --no-tags --depth=1 origin "$W01_HISTORY_BASE"
            if git diff --name-only "$W01_HISTORY_BASE" "$W01_HISTORY_HEAD" -- docs/w01/history.json docs/w01/retained-history.json docs/w01/retained-preview-manifest.json | grep -q .; then
              force_rebuild=true
              reason=history-manifest-changed
            fi
          fi
          echo "force_rebuild=$force_rebuild" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci
      - name: Install the locked Playwright Chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build baseline source required by current retain
        working-directory: baseline
        run: npm run build
      - name: Restore or rebuild retained W01 history
        id: retained-history
        working-directory: web
        run: >-
          node scripts/w01-history.mjs
          --command prepare
          --repo-root .
          --history docs/w01/history.json
          --output "$GITHUB_WORKSPACE/web/dist-w01"
          --freeze-root "$RUNNER_TEMP"
          --work-root "$RUNNER_TEMP/w01-history-work"
          --bundle-root "$RUNNER_TEMP/w01-history-bundle"
          --archive "$RUNNER_TEMP/w01-retained-history/w01-retained-history.tar"
          --manifest-out "$RUNNER_TEMP/w01-retained-history/retained-history.json"
          --force-rebuild "${{ steps.history-policy.outputs.force_rebuild }}"
          --summary "$GITHUB_STEP_SUMMARY"
          --github-output "$GITHUB_OUTPUT"
      - name: Build current pending 0.0.17 candidate preview
        working-directory: web
        run: npm run w01:build -- --candidate-preview --output dist-w01
      - name: Retain the pinned baseline in current 0.0.17 candidate
        working-directory: web
        run: npm run w01:retain -- --baseline-root ../baseline --output dist-w01
      - name: Verify current 0.0.17 and retained historical data URLs
        working-directory: web
        run: npm run w01:verify -- dist-w01
      - name: Run Web tests against pinned lifecycle packages
        working-directory: web
        env:
          W01_PRIOR_R1_ROOT: ${{ github.workspace }}/prior-r1
          W01_PRIOR_R2_ROOT: ${{ github.workspace }}/prior-r2
          W01_BASELINE_ROOT: ${{ github.workspace }}/baseline
          W01_PRIOR_REAL_R3_ROOT: ${{ runner.temp }}/w01-real-r3
          W01_PRIOR_REAL_R4_ROOT: ${{ runner.temp }}/w01-real-r4
          W01_PRIOR_REAL_R5_ROOT: ${{ runner.temp }}/w01-real-r5
          W01_PRIOR_REAL_R6_ROOT: ${{ runner.temp }}/w01-real-r6
          W01_PRIOR_REAL_R7_ROOT: ${{ runner.temp }}/w01-real-r7
          W01_PRIOR_REAL_R12_ROOT: ${{ runner.temp }}/w01-real-r12
          W01_PRIOR_REAL_R13_ROOT: ${{ runner.temp }}/w01-real-r13
          W01_PRIOR_REAL_R15_ROOT: ${{ runner.temp }}/w01-real-r15
          W01_PRIOR_REAL_R16_ROOT: ${{ runner.temp }}/w01-real-r16
        run: npm test
      - name: Upload rebuilt retained-history release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_history == true && steps.retained-history.outputs.rebuilt == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w01-retained-history-release-assets
          path: ${{ runner.temp }}/w01-retained-history/
          if-no-files-found: error
          retention-days: 1
      - name: Upload only the isolated W01 preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darktide-w01-isolated-preview
          path: web/dist-w01/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy only the fixed W01 preview worker
        if: github.event_name == 'push' && github.repository == 'SyuanTsai/DarkTide-Web' && github.ref == 'refs/heads/codex/SYP-311-w01' && steps.deployment-scope.outputs.should_deploy == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SyuanTsai/DarkTide-Web"
          test "$GITHUB_REF" = "refs/heads/codex/SYP-311-w01"
          git fetch --no-tags origin "refs/heads/codex/SYP-311-w01:refs/remotes/origin/codex/SYP-311-w01"
          branch_head="$(git rev-parse refs/remotes/origin/codex/SYP-311-w01)"
          test "$branch_head" = "$GITHUB_SHA"
          npm run w01:verify
          ./node_modules/.bin/wrangler deploy --config wrangler.w01-preview.json
      - name: Verify the deployed preview and write a deployment receipt
        if: github.event_name == 'push' && github.repository == 'SyuanTsai/DarkTide-Web' && github.ref == 'refs/heads/codex/SYP-311-w01' && steps.deployment-scope.outputs.should_deploy == 'true'
        working-directory: web
        env:
          W01_DEPLOYMENT_RECEIPT: ${{ runner.temp }}/w01-preview-deployment-receipt.json
          W01_PREVIOUS_PACKAGE_ROOT: ${{ runner.temp }}/w01-real-r16
        run: node scripts/w01-preview-deployment-receipt.mjs --output "$W01_DEPLOYMENT_RECEIPT" --previous-package "$W01_PREVIOUS_PACKAGE_ROOT"
      - name: Upload the public preview deployment receipt
        if: github.event_name == 'push' && github.repository == 'SyuanTsai/DarkTide-Web' && github.ref == 'refs/heads/codex/SYP-311-w01' && steps.deployment-scope.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darktide-w01-preview-deployment-receipt
          path: ${{ runner.temp }}/w01-preview-deployment-receipt.json
          if-no-files-found: error
          retention-days: 30
  publish-retained-history:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_history == true
    needs: isolated-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download rebuilt retained-history release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: w01-retained-history-release-assets
          path: release-assets
      - name: Publish retained history to the fixed Release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view w01-retained-history --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create w01-retained-history --repo "$GITHUB_REPOSITORY" --title "W01 retained history" --notes "Verified retained W01 preview history."
          fi
          gh release upload w01-retained-history release-assets/w01-retained-history.tar release-assets/retained-history.json --clobber --repo "$GITHUB_REPOSITORY"
