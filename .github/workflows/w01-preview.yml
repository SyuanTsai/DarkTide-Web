name: W01 isolated preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/w01/**'
      - 'source.lock.json'
      - 'scripts/w01-*.mjs'
      - 'test/w01-*.test.mjs'
      - 'docs/w01/retained-preview-manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/w01-preview.yml'
  push:
    branches: [codex/SYP-311-w01]
permissions:
  contents: read
concurrency:
  group: w01-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Web candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned prior preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 8a4b3db2b1e835f0757f387ca89a19b9092b35ee
          path: baseline
          persist-credentials: false
      - name: Check out the exact pinned R1 preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 872bd72bad255d40af62329b8ffe97a357935275
          path: prior-r1
          persist-credentials: false
      - name: Check out the exact published R2 A data source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
