          W01_BASELINE_ROOT: ${{ github.workspace }}/baseline
          W01_PRIOR_REAL_R3_ROOT: ${{ runner.temp }}/w01-real-r3
          W01_PRIOR_REAL_R4_ROOT: ${{ runner.temp }}/w01-real-r4
          W01_PRIOR_REAL_R5_ROOT: ${{ runner.temp }}/w01-real-r5
          W01_PRIOR_REAL_R6_ROOT: ${{ runner.temp }}/w01-real-r6
          W01_PRIOR_REAL_R7_ROOT: ${{ runner.temp }}/w01-real-r7
