        working-directory: prior-real-0-0-3
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published real 0.0.3 and retained historical data URLs
        working-directory: prior-real-0-0-3
        run: npm run w01:verify -- ../web/dist-w01
      - name: Freeze the verified published 0.0.3 package for lifecycle tests
        working-directory: prior-real-0-0-3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01-real-r3"
          cp -a ../web/dist-w01/. "$RUNNER_TEMP/w01-real-r3/"
      - name: Rebuild the exact published 0.0.4 package and retained data
        working-directory: prior-real-0-0-4
