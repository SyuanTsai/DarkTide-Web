name: W01 isolated preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/w01/**'
      - 'source.lock.json'
      - 'scripts/w01-*.mjs'
      - 'test/w01-*.test.mjs'
      - 'docs/w01/retained-preview-manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/w01-preview.yml'
  push:
    branches: [codex/SYP-311-w01]
permissions:
  contents: read
concurrency:
  group: w01-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Web candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: web
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned prior preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 8a4b3db2b1e835f0757f387ca89a19b9092b35ee
          path: baseline
          persist-credentials: false
      - name: Check out the exact pinned R1 preview source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 872bd72bad255d40af62329b8ffe97a357935275
          path: prior-r1
          persist-credentials: false
      - name: Check out the exact published R2 A data source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: a7fabea66f56cd5c8236b6e84a3f6c6586175840
          path: prior-r2
          persist-credentials: false
      - name: Check out the exact published pending 0.0.3 candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: e516a5b896f78273544c16047126c327337a8424
          path: prior-real-0-0-3
          persist-credentials: false
      - name: Check out the exact published pending 0.0.4 candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: b401ae50d7ebb7e44aeb59a8c864a8b93628aead
          path: prior-real-0-0-4
          persist-credentials: false
      - name: Check out the exact published pending 0.0.5 candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: a09863ceac2bfca3944d09081c315d62b704563c
          path: prior-real-0-0-5
          persist-credentials: false
      - name: Check out the exact published pending 0.0.6 candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: f2a465e9858e57c3a4850126522dacc71226453d
          path: prior-real-0-0-6
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci
      - name: Rebuild the pinned production baseline data
        working-directory: baseline
        run: npm run build
      - name: Rebuild exact R1 package into the candidate output
        working-directory: prior-r1
        run: npm run w01:build -- --output ../web/dist-w01
      - name: Retain the pinned production baseline in R1 package
        working-directory: prior-r1
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact R1 package and retained data
        working-directory: prior-r1
        run: npm run w01:verify -- ../web/dist-w01
      - name: Rebuild exact published R2 A package into the candidate output
        working-directory: prior-r2
        run: npm run w01:build -- --output ../web/dist-w01
      - name: Retain the pinned production baseline in exact R2 A package
        working-directory: prior-r2
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published R2 A and retained R1 and production data revisions
        working-directory: prior-r2
        run: npm run w01:verify -- ../web/dist-w01
      - name: Rebuild exact published real 0.0.3 package into the candidate output
        working-directory: prior-real-0-0-3
        run: npm run w01:build -- --candidate-preview --output ../web/dist-w01
      - name: Retain the pinned production baseline in exact 0.0.3 package
        working-directory: prior-real-0-0-3
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published real 0.0.3 and retained historical data URLs
        working-directory: prior-real-0-0-3
        run: npm run w01:verify -- ../web/dist-w01
      - name: Freeze the verified published 0.0.3 package for lifecycle tests
        working-directory: prior-real-0-0-3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01-real-r3"
          cp -a ../web/dist-w01/. "$RUNNER_TEMP/w01-real-r3/"
      - name: Rebuild the exact published 0.0.4 package and retained data
        working-directory: prior-real-0-0-4
        run: npm run w01:build -- --candidate-preview --output ../web/dist-w01
      - name: Retain the pinned baseline in exact published 0.0.4 package
        working-directory: prior-real-0-0-4
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published 0.0.4 and retained historical data URLs
        working-directory: prior-real-0-0-4
        run: npm run w01:verify -- ../web/dist-w01
      - name: Freeze the verified published 0.0.4 package for lifecycle tests
        working-directory: prior-real-0-0-4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01-real-r4"
          cp -a ../web/dist-w01/. "$RUNNER_TEMP/w01-real-r4/"
      - name: Rebuild the exact published 0.0.5 package and retained data
        working-directory: prior-real-0-0-5
        run: npm run w01:build -- --candidate-preview --output ../web/dist-w01
      - name: Retain the pinned baseline in exact published 0.0.5 package
        working-directory: prior-real-0-0-5
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published 0.0.5 and retained historical data URLs
        working-directory: prior-real-0-0-5
        run: npm run w01:verify -- ../web/dist-w01
      - name: Freeze the verified published 0.0.5 package for lifecycle tests
        working-directory: prior-real-0-0-5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01-real-r5"
          cp -a ../web/dist-w01/. "$RUNNER_TEMP/w01-real-r5/"
      - name: Rebuild the exact published 0.0.6 package and retained data
        working-directory: prior-real-0-0-6
        run: npm run w01:build -- --candidate-preview --output ../web/dist-w01
      - name: Retain the pinned baseline in exact published 0.0.6 package
        working-directory: prior-real-0-0-6
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published 0.0.6 and retained historical data URLs
        working-directory: prior-real-0-0-6
        run: npm run w01:verify -- ../web/dist-w01
      - name: Freeze the verified published 0.0.6 package for lifecycle tests
        working-directory: prior-real-0-0-6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w01-real-r6"
          cp -a ../web/dist-w01/. "$RUNNER_TEMP/w01-real-r6/"
      - name: Build current pending 0.0.7 candidate preview
        working-directory: web
        run: npm run w01:build -- --candidate-preview --output dist-w01
      - name: Retain the pinned baseline in current 0.0.7 candidate
        working-directory: web
        run: npm run w01:retain -- --baseline-root ../baseline --output dist-w01
      - name: Verify current 0.0.7 and retained historical data URLs
        working-directory: web
        run: npm run w01:verify -- dist-w01
      - name: Run Web tests against pinned lifecycle packages
        working-directory: web
        env:
          W01_PRIOR_R1_ROOT: ${{ github.workspace }}/prior-r1
          W01_PRIOR_R2_ROOT: ${{ github.workspace }}/prior-r2
          W01_BASELINE_ROOT: ${{ github.workspace }}/baseline
          W01_PRIOR_REAL_R3_ROOT: ${{ runner.temp }}/w01-real-r3
          W01_PRIOR_REAL_R4_ROOT: ${{ runner.temp }}/w01-real-r4
          W01_PRIOR_REAL_R5_ROOT: ${{ runner.temp }}/w01-real-r5
          W01_PRIOR_REAL_R6_ROOT: ${{ runner.temp }}/w01-real-r6
        run: npm test
      - name: Upload only the isolated W01 preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darktide-w01-isolated-preview
          path: web/dist-w01/
          if-no-files-found: error
          retention-days: 7
      - name: Deploy only the fixed W01 preview worker
        if: github.event_name == 'push' && github.repository == 'SyuanTsai/DarkTide-Web' && github.ref == 'refs/heads/codex/SYP-311-w01'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SyuanTsai/DarkTide-Web"
          test "$GITHUB_REF" = "refs/heads/codex/SYP-311-w01"
          git fetch --no-tags origin "refs/heads/codex/SYP-311-w01:refs/remotes/origin/codex/SYP-311-w01"
          branch_head="$(git rev-parse refs/remotes/origin/codex/SYP-311-w01)"
          test "$branch_head" = "$GITHUB_SHA"
          npm run w01:verify
          ./node_modules/.bin/wrangler deploy --config wrangler.w01-preview.json
      - name: Verify the deployed preview and write a deployment receipt
        if: github.event_name == 'push' && github.repository == 'SyuanTsai/DarkTide-Web' && github.ref == 'refs/heads/codex/SYP-311-w01'
        working-directory: web
        env:
          W01_DEPLOYMENT_RECEIPT: ${{ runner.temp }}/w01-preview-deployment-receipt.json
        run: node scripts/w01-preview-deployment-receipt.mjs --output "$W01_DEPLOYMENT_RECEIPT"
      - name: Upload the public preview deployment receipt
        if: github.event_name == 'push' && github.repository == 'SyuanTsai/DarkTide-Web' && github.ref == 'refs/heads/codex/SYP-311-w01'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: darktide-w01-preview-deployment-receipt
          path: ${{ runner.temp }}/w01-preview-deployment-receipt.json
          if-no-files-found: error
          retention-days: 30
