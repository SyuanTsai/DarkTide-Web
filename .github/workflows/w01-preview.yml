          package-manager-cache: false
      - name: Install locked Web dependencies
        working-directory: web
        run: npm ci
      - name: Rebuild the pinned production baseline data
        working-directory: baseline
        run: npm run build
      - name: Rebuild exact R1 package into the candidate output
        working-directory: prior-r1
        run: npm run w01:build -- --output ../web/dist-w01
      - name: Retain the pinned production baseline in R1 package
        working-directory: prior-r1
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact R1 package and retained data
        working-directory: prior-r1
        run: npm run w01:verify -- ../web/dist-w01
      - name: Rebuild exact published R2 A package into the candidate output
        working-directory: prior-r2
        run: npm run w01:build -- --output ../web/dist-w01
      - name: Retain the pinned production baseline in exact R2 A package
        working-directory: prior-r2
        run: npm run w01:retain -- --baseline-root ../baseline --output ../web/dist-w01
      - name: Verify exact published R2 A and retained R1 and production data revisions
        working-directory: prior-r2
        run: npm run w01:verify -- ../web/dist-w01
      - name: Rebuild exact published real 0.0.3 package into the candidate output
        working-directory: prior-real-0-0-3
        run: npm run w01:build -- --candidate-preview --output ../web/dist-w01
