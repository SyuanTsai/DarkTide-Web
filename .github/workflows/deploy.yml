name: Deploy pinned Source-Data to Cloudflare
on:
  workflow_dispatch:
    inputs:
      source_data_commit:
        description: Source-Data full commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: darktide-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate source commit
        env:
          SOURCE_DATA_COMMIT: ${{ inputs.source_data_commit }}
        run: |
          if ($env:SOURCE_DATA_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'source_data_commit must be 40 lowercase hex characters' }
      - name: Check out Web
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check out pinned Source-Data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Source-Data
          ref: ${{ inputs.source_data_commit }}
          path: .source-data
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Build pinned production data
        env:
          SOURCE_DATA_COMMIT: ${{ inputs.source_data_commit }}
        run: node scripts/build.mjs --source-data .source-data --source-data-commit $env:SOURCE_DATA_COMMIT --site-origin https://darktide.tw-syuan.com
      - name: Verify static package and browser
        run: |
          node scripts/verify-static.mjs dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/browser-smoke.mjs dist
      - name: Deploy verified Cloudflare versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-deploy.mjs
      - name: Verify online runtime and source.commit
        env:
          SOURCE_DATA_COMMIT: ${{ inputs.source_data_commit }}
        run: node scripts/cloudflare-runtime-smoke.mjs --origin https://darktide.tw-syuan.com --source-data-commit $env:SOURCE_DATA_COMMIT
      - name: Verify online browser
        run: node scripts/browser-smoke.mjs dist --origin https://darktide.tw-syuan.com
