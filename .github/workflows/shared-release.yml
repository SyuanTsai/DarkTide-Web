name: W09 selected shared release
on:
  workflow_run:
    workflows: [Static package CI and Cloudflare deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Promote the reviewed selection or explicitly restore an approved whole-site build
        type: choice
        options: [promote, rollback]
        default: promote
        required: true
      target_release_ids:
        description: Comma-separated allocated Web release IDs for an explicit rollback
        type: string
        required: false
      target_runtime_snapshot_build_id:
        description: Full SHA-256 whole-site runtime snapshot identity for rollback
        type: string
        required: false
      expected_current_json:
        description: Complete expected current pointer snapshot JSON for rollback compare-and-swap
        type: string
        required: false
permissions:
  actions: read
  contents: write
jobs:
  shared-release:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.event != 'pull_request'
        && github.event.workflow_run.head_repository.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: darktide-cloudflare-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: Check out reviewed Web commit without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check the selected composition gate
        id: selected
        if: inputs.action != 'rollback'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, lstatSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const markerPath = path.join(process.cwd(), 'content/contracts/w09/source-handoff/selected.json');
          let info;
          try { info = lstatSync(markerPath); }
          catch (error) {
            if (error.code !== 'ENOENT') throw error;
            appendFileSync(process.env.GITHUB_OUTPUT, 'run=false\n');
            const { readW09OwnerStateBranch } = await import('./scripts/content/contract-w09-state-branch.mjs');
            const owner = await readW09OwnerStateBranch({ repoRoot: process.cwd(), branch: 'w09-release-state' });
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, owner.active
              ? 'A W09 shared release is active but the selected marker is absent. This workflow leaves the active publication unchanged; the legacy publisher also blocks fallback until a reviewed selection is restored.\n'
              : 'No selected W09 composition or active shared release is present; no content version was allocated and no deployment was attempted.\n');
            process.exit(0);
          }
          if (!info.isFile() || info.isSymbolicLink()) throw new Error('selected W09 authority marker must be a regular file');
          const marker = JSON.parse(readFileSync(markerPath, 'utf8'));
          const { validateW09SelectedComposition } = await import('./scripts/content/contract-w09-compose.mjs');
          try { validateW09SelectedComposition(marker); }
          catch { throw new Error('selected W09 composition is malformed; refusing publication'); }
          appendFileSync(process.env.GITHUB_OUTPUT, 'run=true\n');
          NODE
      - name: Confirm same-commit static CI success
        id: ci
        if: steps.selected.outputs.run == 'true' || inputs.action == 'rollback'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/static-ci.yml/runs?branch=main&head_sha=$EXPECTED_SHA&status=completed&per_page=100" --jq '.workflow_runs[] | select(.conclusion == "success") | .head_sha')"
            if printf '%s\n' "$runs" | grep -Fxq "$EXPECTED_SHA"; then
              echo "success=true" >> "$GITHUB_OUTPUT"
            else
              echo "success=false" >> "$GITHUB_OUTPUT"
              echo "No successful static CI run exists for this exact main commit; no W09 state was loaded or changed." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Build, validate, and prepare rollback compare-and-swap input
        if: inputs.action == 'rollback'
        env:
          EXPECTED_CURRENT_JSON: ${{ inputs.expected_current_json }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';

          if (!process.env.EXPECTED_CURRENT_JSON?.trim()) throw new Error('rollback requires an explicit expected-current whole-build snapshot');
          const snapshot = JSON.parse(process.env.EXPECTED_CURRENT_JSON);
          if (!snapshot || typeof snapshot !== 'object' || Array.isArray(snapshot)
              || !Array.isArray(snapshot.activeByGame) || !Object.hasOwn(snapshot, 'runtimeSnapshotBuildId')) {
            throw new Error('rollback expected-current input must contain the full active pointers and runtime snapshot');
          }
          const directory = path.join(process.cwd(), '.tmp');
          mkdirSync(directory, { recursive: true });
          writeFileSync(path.join(directory, 'w09-rollback-expected-current.json'), JSON.stringify(snapshot) + '\n', { flag: 'wx' });
          NODE
      - name: Install locked dependencies
        if: (steps.selected.outputs.run == 'true' || inputs.action == 'rollback') && steps.ci.outputs.success == 'true'
        run: npm ci
      - name: Install Chromium for the exact-artifact browser smoke
        if: (steps.selected.outputs.run == 'true' || inputs.action == 'rollback') && steps.ci.outputs.success == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check out public Source history for fixed-commit replay
        if: (steps.selected.outputs.run == 'true' || inputs.action == 'rollback') && steps.ci.outputs.success == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Source-Data
          ref: main
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm this is still the latest main commit
        id: freshness
        if: (steps.selected.outputs.run == 'true' || inputs.action == 'rollback') && steps.ci.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$latest" = "$EXPECTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipped stale W09 run; main has moved." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out the pinned historical W09 composition inputs
        if: steps.selected.outputs.run == 'true' && steps.ci.outputs.success == 'true' && steps.freshness.outputs.current == 'true' && inputs.action != 'rollback'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SyuanTsai/DarkTide-Web
          ref: 328c80dd9d4e1fc8eb917e2bb62d1be1b016e6ef
          path: composition-inputs
          fetch-depth: 0
          persist-credentials: false
      - name: Promote the selected shared composition
        if: steps.selected.outputs.run == 'true' && steps.ci.outputs.success == 'true' && steps.freshness.outputs.current == 'true' && inputs.action != 'rollback'
        run: node scripts/promote-w09-release.mjs
        env:
          W09_GIT_TOKEN: ${{ github.token }}
          W09_STATE_BRANCH: w09-release-state
          W09_SOURCE_ROOT: ${{ github.workspace }}/source
          W09_COMPOSITION_ROOT: ${{ github.workspace }}/composition-inputs
          W09_EXPECTED_COMPOSITION_COMMIT: 328c80dd9d4e1fc8eb917e2bb62d1be1b016e6ef
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '38d350980998e83d3f405aff0170921a'
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
      - name: Restore the explicit approved whole-site snapshot
        if: inputs.action == 'rollback' && steps.ci.outputs.success == 'true' && steps.freshness.outputs.current == 'true'
        run: >-
          node scripts/promote-w09-release.mjs --rollback
          --target-release-ids "$TARGET_RELEASE_IDS"
          --target-runtime-snapshot-build "$TARGET_RUNTIME_SNAPSHOT_BUILD_ID"
          --expected-current-file .tmp/w09-rollback-expected-current.json
        env:
          W09_GIT_TOKEN: ${{ github.token }}
          W09_STATE_BRANCH: w09-release-state
          W09_SOURCE_ROOT: ${{ github.workspace }}/source
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '38d350980998e83d3f405aff0170921a'
          TARGET_RELEASE_IDS: ${{ inputs.target_release_ids }}
          TARGET_RUNTIME_SNAPSHOT_BUILD_ID: ${{ inputs.target_runtime_snapshot_build_id }}
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
