name: Restore retained static package
on:
  workflow_dispatch:
    inputs:
      backup_tag:
        description: 'Exact site-<commit>-<run>-<attempt> Release tag to retrieve'
        required: true
        type: string
      publish:
        description: 'Publish this verified backup to preview and production (default only verifies in isolation)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  restore:
    if: github.ref == 'refs/heads/main' && github.repository == 'SyuanTsai/DarkTide-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    concurrency:
      group: darktide-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Retrieve exact retained backup
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TAG: ${{ inputs.backup_tag }}
        run: |
          [[ "$BACKUP_TAG" =~ ^site-[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 1
          gh release download "$BACKUP_TAG" --repo "$GITHUB_REPOSITORY" --dir .operations/retained --pattern static-site.tar.gz --pattern source.tar.gz --pattern artifact-manifest.json --pattern deployment.json --pattern backup.json --pattern SHA256SUMS
          node --input-type=module -e 'import assert from "node:assert/strict"; import {inspectBackup} from "./src/operations/backup.mjs"; const record=await inspectBackup(".operations/retained"); assert.equal(record.tag,process.env.BACKUP_TAG);'
      - name: Restore complete package into a new directory
        run: node scripts/operations-restore.mjs --backup .operations/retained --output dist > .operations/restore-verification.json
      - name: Install locked local runtime
        run: npm ci
      - name: Verify isolated Cloudflare runtime
        run: npm run smoke:cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Prevent a stale recovery from replacing newer main
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [ "$latest" = "$GITHUB_SHA" ] || exit 1
      - name: Publish the exact restored package with existing HTTPS and automatic rollback checks
        if: inputs.publish == true
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '38d350980998e83d3f405aff0170921a'
          WRANGLER_SEND_METRICS: 'false'
      - name: Retain the new recovery deployment mapping
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_TAG: ${{ inputs.backup_tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs/promises"; import {verifyStaticPackage} from "./src/static/verify.mjs"; import {validateDeploymentReceipt} from "./src/operations/backup.mjs"; validateDeploymentReceipt(JSON.parse(await fs.readFile(".deployment/last-deployment.json")),await verifyStaticPackage("dist"));'
          file="recovery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          cp .deployment/last-deployment.json ".operations/$file"
          (cd .operations && sha256sum "$file" > "$file.sha256")
          gh release upload "$BACKUP_TAG" ".operations/$file" ".operations/$file.sha256" --repo "$GITHUB_REPOSITORY"
      - name: Save restore result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retained-package-restore-report
          path: |
            .operations/restore-verification.json
            .deployment/last-deployment.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
