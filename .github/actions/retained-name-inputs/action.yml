name: Retained-name inputs
description: Detect and acquire the fixed public inputs required for retained weapon names.
outputs:
  required:
    description: Whether the current Web inputs require retained-name evidence.
    value: ${{ steps.detect.outputs.required }}
  mods-root:
    description: Absolute root of the pinned Mods identity map, or an empty string when not required.
    value: ${{ steps.detect.outputs.required == 'true' && format('{0}/retained-name-mods', github.workspace) || '' }}
  source-root:
    description: Absolute root of the pinned weapon templates, or an empty string when not required.
    value: ${{ steps.detect.outputs.required == 'true' && format('{0}/retained-name-source', github.workspace) || '' }}
runs:
  using: composite
  steps:
    - name: Detect fixed retained-name inputs
      id: detect
      shell: bash
      run: node scripts/content/retained-name-overlay-scan.mjs --repo-root "$GITHUB_WORKSPACE"
    - name: Check out the pinned public Mods identity map for retained weapon names
      if: steps.detect.outputs.required == 'true'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: SyuanTsai/Warhammer-40-000-DARKTIDE-Mods
        ref: 241ad76ce62330472aa423055a5b85db59bb6c0d
        path: retained-name-mods
        sparse-checkout: |
          Game Info/releases/1.13.X/blessings/data
        fetch-depth: 1
        persist-credentials: false
    - name: Check out pinned public 1.13.4 weapon templates
      if: steps.detect.outputs.required == 'true'
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: Aussiemon/Darktide-Source-Code
        ref: e46b8926cfa3fa35503e4b80b15aab7a804314e4
        path: retained-name-source
        sparse-checkout: |
          scripts/settings/equipment/weapon_templates
        fetch-depth: 1
        persist-credentials: false
